name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Vendored libraries match package-lock
        run: npm run vendor && git diff --exit-code src/vendor
      - run: npm test
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-zip
          path: dist/*.zip
