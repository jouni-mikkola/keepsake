<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/32.png" alt="" width="22" height="22" />
      <div class="brand">
        <h1>Keepsake</h1>
        <p id="host"></p>
      </div>
    </header>

    <section class="card">
      <h2>Article</h2>
      <div class="actions">
        <button id="pdf" class="primary">Save as PDF</button>
        <button id="png">Save as image</button>
      </div>
    </section>

    <section class="card">
      <h2>Videos <span id="count" class="count"></span></h2>
      <ul id="videos" class="list"></ul>
      <div id="empty" class="empty" hidden>
        <p class="lead">No videos found yet</p>
        <p>Start the video on the page, then open Keepsake again. YouTube and copy protected videos are not supported.</p>
      </div>
      <details id="more" hidden>
        <summary></summary>
        <ul id="others" class="list"></ul>
      </details>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
