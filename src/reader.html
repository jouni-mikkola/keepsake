<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Keepsake</title>
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <div id="toolbar">
      <span id="status">Preparing…</span>
      <button id="pdf" class="primary">Save as PDF</button>
      <button id="ipdf" title="PDF made of pictures of the pages. Keeps the exact colours whatever the print settings.">Image PDF</button>
      <button id="phone" title="Image PDF with pages the shape of a phone screen and larger text. Good for sharing in chat apps.">Phone PDF</button>
      <button id="png">Save as image</button>
      <button id="theme" title="Switch between light and dark">Dark</button>
    </div>
    <table class="sheet">
      <thead><tr><td class="gap"></td></tr></thead>
      <tbody><tr><td>
        <article id="doc">
          <p id="site" class="kicker"></p>
          <h1 id="title"></h1>
          <p id="byline" class="byline"></p>
          <div id="content"></div>
          <footer id="source"></footer>
        </article>
      </td></tr></tbody>
      <tfoot><tr><td class="gap"></td></tr></tfoot>
    </table>
    <script src="vendor/purify.min.js"></script>
    <script type="module" src="reader.js"></script>
  </body>
</html>
